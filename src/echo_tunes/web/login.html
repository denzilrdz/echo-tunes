<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>echo-tunes</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login">
    <form class="card login-card" id="login" autocomplete="on">
      <div class="brand"><img src="/static/icon.svg" alt="" width="40" height="40"><span>echo-tunes</span></div>
      <p class="muted">Sign in once on this device and it stays signed in.</p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="primary" type="submit">Sign in</button>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <p class="muted small">The password is <code>ECHO_TUNES_DASHBOARD_PASSWORD</code> on your server.</p>
    </form>
  </main>
</body>
</html>
