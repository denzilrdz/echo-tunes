[project]
name = "echo-tunes"
version = "0.5.0"
description = "Self-hosted Alexa skill that plays YouTube Music on your Echo. One Docker container, no AWS, no Amazon password."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denzil Rodrigues" }]
requires-python = ">=3.13"
keywords = ["alexa", "alexa-skill", "echo", "self-hosted", "yt-dlp", "ytmusicapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
  "certifi>=2025.10",
  "cryptography>=46",
  "fastapi>=0.165",
  "httpx>=0.28",
  "prometheus-client>=0.23",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.54",
  "yt-dlp[default]>=2026.11.23",
  "ytmusicapi>=1.12",
]

[project.urls]
Homepage = "https://github.com/denzilrdz/echo-tunes"
Issues = "https://github.com/denzilrdz/echo-tunes/issues"
Changelog = "https://github.com/denzilrdz/echo-tunes/blob/main/CHANGELOG.md"

[project.scripts]
echo-tunes = "echo_tunes.cli:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
  "zizmor>=1.31.1",
]

# Coverage-guided fuzzing (fuzz/); Atheris ships Linux wheels only, up to Python 3.14.
fuzz = ["atheris>=3.1 ; sys_platform == 'linux' and python_version < '3.15'"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_tunes"]

# Only what's committed and needed to build and test: never stray local files (.env, data/).
[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "skill-package", "demo", "scripts",
  # what the demo build (tests/test_demo.py) copies
  "docs/img/social-preview.png", "docs/img/dashboard-light.png", "docs/img/dashboard-dark.png",
  "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/build_demo.py" = ["E501"] # long HTML meta tags

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "ytmusicapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Unclosed files and databases fail the run (ResourceWarnings surface as "unraisable").
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
  "error::ResourceWarning",
  # Old starlette/anyio (the lowest-versions CI run) leave a test client's event loop and its
  # self-pipe unclosed; not our resource, and harmless.
  "ignore:unclosed event loop:ResourceWarning",
  "ignore:unclosed <socket.socket fd=[0-9]+, family=1:ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
