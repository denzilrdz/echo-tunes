# echo-tunes on its own, listening on port 8080 of this machine only.
# Put your own HTTPS reverse proxy in front of it, or use one of the ready-made setups in
# examples/ (Caddy on a server with a public IP, Cloudflare Tunnel, or Tailscale Funnel).
services:
  echo-tunes:
    image: ghcr.io/denzilrdz/echo-tunes:0.3.0
    container_name: echo-tunes
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080" # public side: put your HTTPS proxy/tunnel in front of this one
      - "127.0.0.1:8081:8081" # private dashboard + /metrics: keep it off the internet
    volumes:
      - ./data:/data
    # Hardening: read-only system files, no extra privileges, capped memory.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
