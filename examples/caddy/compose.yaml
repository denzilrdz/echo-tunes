# A server with a public IP (a VPS, AWS EC2, Lightsail, Hetzner, ...) and a domain name
# pointing at it. Caddy gets and renews a free HTTPS certificate on its own.
# Setup: docs/PUBLIC_HTTPS.md#caddy-on-a-server-with-a-public-ip
services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: echo-tunes-caddy
    restart: unless-stopped
    logging: # rotate logs: at most 3 x 10 MB
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}             # e.g. music.example.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    depends_on: [echo-tunes]

  echo-tunes:
    # Our own release, by tag. To pin it exactly, add the digest shown on the release page or by
    # `docker buildx imagetools inspect ghcr.io/denzilrdz/echo-tunes:0.4.1`:
    # image: ghcr.io/denzilrdz/echo-tunes:0.4.1@sha256:<digest>
    image: ghcr.io/denzilrdz/echo-tunes:0.4.1
    container_name: echo-tunes
    restart: unless-stopped
    logging: # rotate logs: at most 3 x 10 MB
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: .env
    ports:
      - "127.0.0.1:8081:8081" # private dashboard (open via SSH: ssh -L 8081:localhost:8081 …)
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
