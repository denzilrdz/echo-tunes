name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you'd like to say to Alexa or do, and why.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
