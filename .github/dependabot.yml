# Keeps SHA-pinned GitHub Actions, the uv-locked Python packages and the Docker base images up
# to date. The cooldown waits before proposing a brand-new release, so a compromised version is
# usually caught and yanked first (security updates are not delayed). yt-dlp has its own daily
# workflow (.github/workflows/yt-dlp.yml) because YouTube fixes can't wait a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies, github_actions]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, python]
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: yt-dlp
      - dependency-name: yt-dlp-ejs
      - dependency-name: ytmusicapi
    groups:
      python:
        patterns: ["*"]
  # The web app (web/): weekly, minor and patch updates grouped. A PR also needs the rebuilt
  # src/echo_tunes/web/dist committed (CI's web job fails until `npm run build` is run).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: [dependencies, javascript]
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # Node's type definitions follow the Node version in web/.nvmrc (24): a new major only
      # when Node itself is upgraded.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories: ["/examples/*"]
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
