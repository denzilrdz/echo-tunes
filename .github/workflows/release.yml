name: release

# Pushing a tag like v0.1.0 publishes a multi-architecture image (amd64 + arm64, so it runs on
# PCs, cloud servers and Raspberry Pis) to ghcr.io with build provenance, and drafts release notes.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing is published unless the tag matches the package version and the tests pass.
  # No caches anywhere in this workflow: they are shared with runs on main (including the daily
  # job that installs brand-new yt-dlp versions), and the provenance would vouch for them.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Tag matches the version in pyproject.toml (vX.Y.Z, or vX.Y.Z-rc.N to try it first)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v${version}" = "${TAG%%-rc.*}" || { echo "::error::tag $TAG but pyproject.toml says $version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q

  image:
    name: image
    needs: check
    runs-on: ubuntu-24.04
    environment: release # only v* tags may deploy to it (Settings -> Environments)
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # build provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both actions cache what they download in the Actions cache by default (the binfmt
      # image, the buildx binary), which runs on main could fill. Off, and binfmt pinned.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          no-cache: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The Python package too, with signed build provenance, attached to the release.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Build the Python package
        run: uv build --out-dir dist
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: "GitHub release (draft, files attached, then published: releases are immutable)"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/echo-tunes-${TAG}.intoto.jsonl"
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --draft dist/*
          case "$TAG" in *-*) gh release edit "$TAG" --prerelease ;; esac
          gh release edit "$TAG" --draft=false
