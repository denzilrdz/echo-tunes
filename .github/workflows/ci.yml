name: ci

# Every push to main and every pull request: workflow lint, privacy check, format, lint,
# type check, tests (including the memory soak test), the web app (lint, types, tests, a
# reproducible build, size budget, an end-to-end test under the real CSP) and a Docker build
# with a smoke test.
on:
  push:
    branches: [main]
  pull_request:
  # The daily yt-dlp job starts this for its pull request: PRs opened with the workflow token
  # don't trigger pull_request runs, and the required checks must still run.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the history
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: No private details (IPs, tailnet names, real IDs)
        run: scripts/check-private-info.sh
      - name: No secrets (gitleaks, whole history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --no-banner --redact
      - run: uv sync --locked
      - name: Lint workflows (zizmor + actionlint)
        env:
          GH_TOKEN: ${{ github.token }} # read-only: lets zizmor check advisories and impostor commits
        run: |
          uv run zizmor --persona=auditor .github/
          uv run actionlint
      - name: Format and lint
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Tests (Python 3.13)
        run: uv run pytest -q
      - name: Tests (Python 3.15, the Docker image's version)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-315
        run: uv run --locked --python 3.15 pytest -q
      - name: Tests at the lowest allowed dependency versions
        run: |
          uv venv -q -p 3.13 .venv-lowest
          uv pip compile -q pyproject.toml --group dev --resolution lowest-direct -p 3.13 -o lowest.txt
          uv pip install -q -p .venv-lowest -r lowest.txt
          uv pip install -q -p .venv-lowest --no-deps .
          .venv-lowest/bin/python -m pytest -q -p no:cacheprovider

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install (exact versions from package-lock.json, no install scripts)
        run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build, and check the committed build is up to date
        run: |
          npm run build
          git diff --exit-code -- ../src/echo_tunes/web/dist
          test -z "$(git status --porcelain -- ../src/echo_tunes/web/dist)"
      - name: Size budget (initial JS <= 150 KB, CSS <= 25 KB, gzipped)
        run: npm run size
      - name: End-to-end under the real CSP (demo and the real dashboard)
        run: |
          uv sync --locked
          uv run python ../scripts/build_demo.py ../site
          npx playwright install --with-deps chromium
          npm run e2e

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: echo-tunes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (starts, healthy, refuses unsigned requests, dashboard stays private)
        run: |
          docker run -d --name et --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 -p 8081:8081 \
            -e ECHO_TUNES_PUBLIC_URL=https://music.example.com \
            -e ECHO_TUNES_SKILL_IDS=amzn1.ask.skill.ci echo-tunes:ci
          for _ in $(seq 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' localhost:8080/alexa)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/stream/x.m4a)" = 404
          # the dashboard, its API and metrics must exist only on the private port
          for p in /api/now /api/history /metrics; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080$p")" = 404
            test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8081$p")" = 200
          done
          curl -fsS localhost:8081/api/health | grep -q '"status":"ok"'
          docker exec et deno --version
          docker logs et
