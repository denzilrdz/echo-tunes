name: fuzz

# Coverage-guided fuzzing (Atheris) of the code that reads untrusted input. Weekly, and on
# changes to that code. A crash fails the job and uploads the input that caused it.
on:
  schedule:
    - cron: "41 3 * * 0"
  pull_request:
    paths:
      - src/echo_tunes/tokens.py
      - src/echo_tunes/stream.py
      - src/echo_tunes/alexa/verify.py
      - src/echo_tunes/player/state.py
      - fuzz/**
      - .github/workflows/fuzz.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        target: [tokens, range, cert_url, player_state]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --group fuzz
      - name: Fuzz for 5 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p crashes
          uv run python "fuzz/fuzz_${TARGET}.py" -max_total_time=300 -artifact_prefix=crashes/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: crashes/
