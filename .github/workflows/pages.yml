name: pages

# Publishes the landing page and the web player demo (the committed build of web/ with a fake
# API, no server, no Node needed here) to
# https://denzilrdz.github.io/echo-tunes/ whenever the app, the demo or the landing page change
# on main.
on:
  push:
    branches: [main]
    paths:
      - src/echo_tunes/web/**
      - demo/**
      - scripts/build_demo.py
      - docs/img/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # Build and upload in one job, deploy in another (GitHub's own Pages layout). In a single job
  # the deploy step sometimes looked for the artifact a moment after uploading it and found
  # none; and re-running that job then found two. A separate deploy job sees the finished
  # upload, and re-running only it reuses that one artifact.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the demo
        run: python3 scripts/build_demo.py site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  demo:
    name: demo
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # deploy the site
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
